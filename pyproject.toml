[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-recruiting-agent"
version = "0.1.0"
description = "Guarded multi-turn recruiting agent: MCP server, LangChain MCP adapters, LangGraph, conversational evals."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ingyu Koh"}]
dependencies = [
  # langchain-mcp-adapters 0.3.x targets the MCP Python SDK 1.x API.
  "mcp>=1.20,<2",
  "langchain-core>=1.0,<2",
  "langchain-mcp-adapters>=0.3,<0.4",
  "langgraph>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.7,<1"]

[project.scripts]
recruiting-mcp-server = "recruiting_agent.mcp_server:main"
recruiting-eval = "recruiting_agent.evals:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recruiting_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS template.
"scripts/build_site.py" = ["E501"]
